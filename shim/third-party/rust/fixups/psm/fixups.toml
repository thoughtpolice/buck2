buildscript.run = false

# psm's build.rs assembles one arch file and sets `cfg(asm)`, which gates
# `psm::stack_pointer`. `stacker`'s Windows backend calls that unconditionally,
# so MSVC cannot compile without it; other platforms degrade gracefully through
# `psm_stack_information!`'s `no` branch, so they are left as they are.
#
# `link_asm` is deliberately not set: it adds `#[link(name = "psm_s")]`, but the
# assembly arrives through the cxx_library dep below instead.
['cfg(all(target_arch = "x86_64", target_os = "windows", target_env = "msvc"))']
cfgs = ["asm"]

[['cfg(all(target_arch = "x86_64", target_os = "windows", target_env = "msvc"))'.cxx_library]]
name = "psm-asm-windows-msvc-x86_64"
srcs = ["src/arch/x86_64_msvc.asm"]
preferred_linkage = "static"
